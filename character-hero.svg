<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a40" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#ff7b00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffccd0"/>
      <stop offset="70%" stop-color="#ff2a40"/>
      <stop offset="100%" stop-color="#600008"/>
    </linearGradient>

    <linearGradient id="haoriPattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="50%" stop-color="#1d202d"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>

    <linearGradient id="flameHaori" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a40"/>
      <stop offset="45%" stop-color="#ff7b00"/>
      <stop offset="80%" stop-color="#f4c430"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="250" cy="250" r="230" fill="url(#auraGlow)"/>

  <!-- Japanese Sun Crest Behind -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="250" cy="220" r="120" fill="none" stroke="#f4c430" stroke-width="1.5" opacity="0.4"/>

  <!-- Demon Slayer Character Silhouette & Elements -->
  <!-- Shoulders & Corps Uniform -->
  <path d="M120 480 C130 380, 160 340, 250 340 C340 340, 370 380, 380 480 Z" fill="#11131c"/>
  
  <!-- Corps White Belt & Gold Buckle -->
  <rect x="200" y="440" width="100" height="14" fill="#ffffff" rx="2" opacity="0.9"/>
  <rect x="238" y="437" width="24" height="20" fill="#f4c430" rx="3"/>
  <rect x="244" y="443" width="12" height="8" fill="#11131c"/>

  <!-- Haori Left & Right Wing (With Flame Patterns) -->
  <path d="M120 480 C135 375, 175 350, 205 355 C190 395, 180 440, 170 480 Z" fill="url(#flameHaori)"/>
  <path d="M380 480 C365 375, 325 350, 295 355 C310 395, 320 440, 330 480 Z" fill="url(#flameHaori)"/>

  <!-- White Corps Button Placket & Collar -->
  <path d="M225 340 L250 385 L275 340 Z" fill="#1b1d28"/>
  <polygon points="250,345 244,380 256,380" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="395" r="3.5" fill="#f4c430"/>
  <circle cx="250" cy="415" r="3.5" fill="#f4c430"/>

  <!-- Neck & Face -->
  <path d="M232 300 L232 345 C232 355, 268 355, 268 345 L268 300 Z" fill="#f5cbb7"/>
  <polygon points="250,335 240,305 260,305" fill="#e2b19b"/>

  <!-- Jawline & Head Structure -->
  <path d="M190 220 C190 285, 220 315, 250 315 C280 315, 310 285, 310 220 C310 160, 280 150, 250 150 C220 150, 190 160, 190 220 Z" fill="#ffdfce"/>

  <!-- Anime Hair Structure (Dynamic Spiky Demon Slayer Style) -->
  <path d="M180 220 C170 180, 195 130, 250 120 C305 130, 330 180, 320 220 C310 175, 285 160, 250 160 C215 160, 190 175, 180 220 Z" fill="#1a1c24"/>
  <path d="M165 210 C180 160, 205 110, 250 95 C295 110, 320 160, 335 210 C325 150, 290 125, 250 125 C210 125, 175 150, 165 210 Z" fill="#ff2a40" opacity="0.85"/>
  
  <!-- Forehead Mark (Demon Slayer Demon Mark / Flame Scar) -->
  <path d="M222 170 C220 180, 225 186, 230 190 C228 184, 232 180, 234 172 C230 175, 225 174, 222 170 Z" fill="#b11d27"/>
  <path d="M228 174 C227 182, 233 186, 235 182 Z" fill="#ff3b4e"/>

  <!-- Eyes (Anime Focus & Sharp Determination) -->
  <path d="M210 230 Q225 222 235 230" stroke="#1a1c24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="223" cy="235" rx="5.5" ry="7" fill="#ff2a40"/>
  <circle cx="223" cy="235" r="3" fill="#11131c"/>
  <circle cx="225" cy="233" r="1.5" fill="#ffffff"/>

  <path d="M265 230 Q275 222 290 230" stroke="#1a1c24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="277" cy="235" rx="5.5" ry="7" fill="#ff2a40"/>
  <circle cx="277" cy="235" r="3" fill="#11131c"/>
  <circle cx="279" cy="233" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M205 218 L235 222" stroke="#1a1c24" stroke-width="3" stroke-linecap="round"/>
  <path d="M295 218 L265 222" stroke="#1a1c24" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose & Confident Smile -->
  <polygon points="250,248 247,256 253,256" fill="#dda993"/>
  <path d="M242 274 Q250 280 258 274" stroke="#1a1c24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Hanafuda Earring (Mark Dave Acuña Edition) -->
  <g transform="translate(182, 255)">
    <rect x="0" y="0" width="12" height="24" rx="1.5" fill="#ffffff" stroke="#11131c" stroke-width="1"/>
    <circle cx="6" cy="7" r="4.5" fill="#ff2a40"/>
    <line x1="6" y1="12" x2="6" y2="22" stroke="#11131c" stroke-width="1"/>
    <line x1="2" y1="16" x2="10" y2="16" stroke="#11131c" stroke-width="1"/>
  </g>

  <!-- Nichirin Katana Blade Crossing In Front with Crimson Flame Glow -->
  <g filter="url(#glowFilter)">
    <!-- Blade Spine -->
    <path d="M60 440 L380 180" stroke="url(#bladeGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Blade Hamon Line -->
    <path d="M64 438 Q160 350 260 270 T376 182" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.95"/>
    <!-- Tsuba Sword Guard (Flame Shaped) -->
    <ellipse cx="140" cy="380" rx="16" ry="24" fill="#f4c430" stroke="#b11d27" stroke-width="3" transform="rotate(-35 140 380)"/>
    <!-- Tsuka Hilt & Wrap -->
    <path d="M140 380 L80 430" stroke="#ffffff" stroke-width="10" stroke-linecap="square"/>
    <path d="M140 380 L80 430" stroke="#11131c" stroke-width="9" stroke-dasharray="6 6"/>
  </g>

  <!-- Drifting Embers & Sakura Petals -->
  <circle cx="120" cy="180" r="3" fill="#ffbe0b" filter="url(#glowFilter)"/>
  <circle cx="370" cy="270" r="2.5" fill="#ff2a40" filter="url(#glowFilter)"/>
  <circle cx="340" cy="140" r="3.5" fill="#ff7b00" filter="url(#glowFilter)"/>
  <circle cx="160" cy="310" r="2" fill="#ffffff"/>
</svg>
