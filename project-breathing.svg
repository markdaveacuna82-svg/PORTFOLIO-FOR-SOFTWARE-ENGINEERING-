<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="sunWheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff2a40" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0b12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="#08090f"/>
  <circle cx="300" cy="180" r="160" fill="url(#sunWheel)"/>

  <!-- Rotating Breathing Technique Wheel Elements -->
  <!-- Water Breathing Symbol -->
  <g transform="translate(190, 100)">
    <circle cx="0" cy="0" r="32" fill="#101826" stroke="#00b4d8" stroke-width="2"/>
    <text x="0" y="8" font-family="'Yuji Boku', serif" font-size="22" fill="#90e0ef" text-anchor="middle">水</text>
  </g>

  <!-- Thunder Breathing Symbol -->
  <g transform="translate(410, 100)">
    <circle cx="0" cy="0" r="32" fill="#1b1710" stroke="#ffbe0b" stroke-width="2"/>
    <text x="0" y="8" font-family="'Yuji Boku', serif" font-size="22" fill="#ffd166" text-anchor="middle">雷</text>
  </g>

  <!-- Flame Breathing Symbol -->
  <g transform="translate(300, 70)">
    <circle cx="0" cy="0" r="36" fill="#201014" stroke="#ff2a40" stroke-width="2.5"/>
    <text x="0" y="9" font-family="'Yuji Boku', serif" font-size="26" fill="#ff2a40" text-anchor="middle">炎</text>
  </g>

  <!-- Stone Breathing Symbol -->
  <g transform="translate(190, 260)">
    <circle cx="0" cy="0" r="32" fill="#181512" stroke="#a3704c" stroke-width="2"/>
    <text x="0" y="8" font-family="'Yuji Boku', serif" font-size="22" fill="#e5b869" text-anchor="middle">岩</text>
  </g>

  <!-- Mist Breathing Symbol -->
  <g transform="translate(410, 260)">
    <circle cx="0" cy="0" r="32" fill="#101a20" stroke="#70d6ff" stroke-width="2"/>
    <text x="0" y="8" font-family="'Yuji Boku', serif" font-size="22" fill="#b8e7ff" text-anchor="middle">霞</text>
  </g>

  <!-- Center Sun Breathing / Hinokami Kagura -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="50" fill="#1a0a0d" stroke="#f4c430" stroke-width="3"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ff2a40" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="0" y="12" font-family="'Yuji Boku', serif" font-size="34" fill="#ff4d00" text-anchor="middle" font-weight="900">日の呼吸</text>
  </g>

  <!-- Banner Bottom -->
  <rect x="140" y="305" width="320" height="32" rx="6" fill="#121420" stroke="#e5b869" stroke-width="1"/>
  <text x="300" y="326" font-family="'Outfit', sans-serif" font-size="12" fill="#ffd670" text-anchor="middle" font-weight="600" letter-spacing="1.5">BREATHING STYLES INTERACTIVE ASSESSMENT</text>
</svg>
